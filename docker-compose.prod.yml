version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: truyendex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: truyendex
      POSTGRES_USER: truyendex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - truyendex-network

  # Redis for sessions
  redis:
    image: redis:7-alpine
    container_name: truyendex-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - truyendex-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truyendex-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://truyendex:${POSTGRES_PASSWORD}@postgres:5432/truyendex
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - PORT=8000
      - FRONTEND_URL=https://ninetails.site
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    networks:
      - truyendex-network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truyendex-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://ninetails.site/api
      - NEXT_PUBLIC_MANGADEX_API_URL=https://api.mangadex.org
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - truyendex-network

volumes:
  postgres_data:
  redis_data:

networks:
  truyendex-network:
    driver: bridge
